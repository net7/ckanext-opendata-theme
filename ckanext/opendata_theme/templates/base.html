{% ckan_extends %}

{% block styles %}
{{ super() }}
{% asset 'opendata-theme/font_css' %}
{% asset 'opendata-theme/opendata_theme_css' %}
{% asset 'opendata-theme/splide_js' %}
{% asset 'opendata-theme/opendata_theme_js' %}
{% endblock %}

{% block meta %}
{{ super() }}
  <meta property="og:title" content="{{ g.site_title }}" />
  <meta property="og:description" content="{{ g.site_description }}" />
  <meta property="og:image" content="{{ h.url_for('home.index', _external=True) }}images/OpenData.jpg" />
  <meta property="og:url" content="{{ h.url_for('home.index', _external=True) }}" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="{{ g.site_title }}" />
  <meta property="og:image:width" content="915" />
  <meta property="og:image:height" content="492" />
  <meta property="og:image:alt" content="{{ g.site_title }}" />
{% endblock %}
