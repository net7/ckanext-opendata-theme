{% set current_url = h.full_current_url() %}
{% block social %}
<section class="rtds-py-4 rtds-grid rtds-gap-4 rtds-pr-16">
  {% block social_title %}
  <h3 class="rtds-body-lg rtds-font-bold">{{ _('Social') }}</h3>
  {% endblock %}
  {% block social_nav %}
  <ul class="rtds-flex rtds-flex-wrap rtds-gap-4">
    
    <li>
      <a href="https://x.com/intent/tweet?url={{ current_url }}" target="_blank" aria-label="{{ _('share on x') }}">
        <svg class="rtds-inline-block rtds-align-middle rtds-fill-current rtds-w-8 rtds-h-8" aria-hidden="true" focusable="false" role="img">
          <use href="/icons.svg#mini--x" />
        </svg>
      </a>
    </li>
    
    {#
    <li>
      <a href="" target="_blank" aria-label="{{ _('share on instagram') }}">
        <svg class="rtds-inline-block rtds-align-middle rtds-fill-current rtds-w-8 rtds-h-8" aria-hidden="true" focusable="false" role="img">
          <use href="/icons.svg#mini--instagram" />
        </svg>
      </a>
    </li>
    #}
    
    <li>
      <a href="https://www.facebook.com/sharer.php?u={{ current_url }}" target="_blank" aria-label="{{ _('share on facebook') }}">
        <svg class="rtds-inline-block rtds-align-middle rtds-fill-current rtds-w-8 rtds-h-8" aria-hidden="true" focusable="false" role="img">
          <use href="/icons.svg#mini--facebook" />
        </svg>
      </a>
    </li>

    <li>
      <a href="https://www.linkedin.com/sharing/share-offsite/?url={{ current_url }}" target="_blank" aria-label="{{ _('share on linkedin') }}">
        <svg class="rtds-inline-block rtds-align-middle rtds-fill-current rtds-w-8 rtds-h-8" aria-hidden="true" focusable="false" role="img">
          <use href="/icons.svg#solid--linkedin" />
        </svg>
      </a>
    </li>
  </ul>
  {% endblock %}
</section>
{% endblock %}
